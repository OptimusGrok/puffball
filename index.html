<script>
"use strict";
const $=s=>document.querySelector(s),cv=$('#c'),ctx=cv.getContext('2d');
const WW=1500,TOP=-6400;let VW=240,VH=400,SC=2;
function resize(){const w=innerWidth,h=innerHeight;SC=Math.max(1,Math.min(w/240,h/200));VW=Math.ceil(w/SC);VH=Math.ceil(h/SC);cv.width=VW;cv.height=VH;ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);resize();
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault());
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647},rr=(a,b)=>a+rnd()*(b-a);
const hash=n=>{n=Math.sin(n*127.1)*43758.5453;return n-Math.floor(n)};
const OL='#3a1d5c';
// ================= LEVEL =================
let plats,path,stars,springs,enemies,hooks,cps,winds,trees,flowers,castle;
const zoneOf=y=>y>-1800?'grass':y>-3600?'hill':'cloud';
function P(x,y,w,t,o={}){const p=Object.assign({x,y,w,h:t=='wall'?o.h:7,t,zone:zoneOf(y)},o);plats.push(p);return p}
function addPath(p){p.idx=path.length;path.push(p);return p}
function buildLevel(){seed=11;plats=[];path=[];stars=[];springs=[];enemies=[];hooks=[];cps=[];winds=[];trees=[];flowers=[];
 const ground=P(-50,0,WW+100,'solid',{h:80});addPath(ground);
 for(let k=0;k<14;k++)trees.push({x:60+k*105+rr(-20,20),y:0,s:rr(.9,1.5),ph:rnd()*6});
 for(let k=0;k<60;k++)flowers.push({x:rr(10,WW-10),y:0,c:['#ff6fae','#ffe066','#fff','#8fd3ff'][k%4],ph:rnd()*6});
 let x=150,y=0,dir=1,leg=0;const L=()=>path[path.length-1];
 // starter steps
 while(y>TOP+260){leg++;const zone=zoneOf(y);const style=['steps','hops','bigs','mix'][leg%4];
  // ---- horizontal run ----
  let n=0;while(dir>0?x<WW-300:x>300){n++;let dx,dy;
   if(style=='steps'){dx=rr(55,80);dy=rr(18,34)}else if(style=='hops'){dx=rr(60,74);dy=n%2?rr(-12,6):rr(24,36)}else if(style=='bigs'){if(n%3==0){dx=rr(30,45);dy=rr(85,105)}else{dx=rr(60,80);dy=rr(6,22)}}else{dx=rr(50,72);dy=rr(0,36)}
   x+=dx*dir;y-=dy;if(y>-30)y=-30;const w=zone=='cloud'?rr(48,60):rr(48,66);let t=zone=='cloud'&&dy<60&&rnd()<.4?'cloud':'oneway';if(dy>60&&L().t=='cloud')L().t='oneway';
   const p=addPath(P(x-w/2,y,w,t,{big:dy>60}));
   if(zone=='cloud'&&t=='oneway'&&dy<60&&rnd()<.3){p.mover=true;p.move=rr(16,28);p.ph=rnd()*6;p.bx=p.x}
   if(rnd()<.6)stars.push({x,y:y-14});
   if(n%4==2&&zone!='cloud'&&p.w>50)p.flowers=true;
   if(zone=='grass'&&rnd()<.35)trees.push({x:x+rr(-20,20),y:y+rr(30,60),s:rr(.7,1.1),ph:rnd()*6,bg:true});
   // star arc over gaps
   if(n%5==0){for(let k=1;k<4;k++)stars.push({x:x-dir*dx*k/4,y:y-30-Math.sin(k/4*Math.PI)*22})}
   // bonus side platform with enemy / stars
   if(n%6==3){const sp=P(x-dir*10-25,y-rr(100,112),50,zone=='cloud'?'cloud':'oneway');stars.push({x:sp.x+15,y:sp.y-12},{x:sp.x+35,y:sp.y-12});
    if(leg>1)enemies.push({kind:zone=='cloud'?'buzz':(zone=='hill'?'hopper':'bloop'),x:sp.x+25,y:sp.y-7,p:sp,dir:1,alive:true,by:sp.y-26,ph:rnd()*6})}
   // hooks: in cloud/hill zones a hook over the gap leading to a star cluster
   if(zone!='grass'&&n%5==1){const hk={x:x-dir*dx/2,y:y-75};hooks.push(hk);for(let k=0;k<4;k++)stars.push({x:hk.x-12+k*8,y:hk.y-22})}
   if(zone=='cloud'&&n%7==4)winds.push({x0:x-200,x1:x+200,y0:y-80,y1:y+30,dir:dir,ph:rnd()*6});
   if(false)springs.push({x:p.x+p.w/2,y:p.y,p});
  }
  if(y<TOP+260)break;
  // ---- turn section (hand-made set pieces) ----
  const kind=['chimney','spring','ladder'][leg%3];const edge=dir>0?WW:0;
  if(kind=='chimney'){// shaft between inner wall and world edge; ledges alternate; walls good for wall-jumping
   const inner=dir>0?WW-150:136,last=L();const y0=last.y;
   addPath(P(dir>0?inner-26:inner-24+14,y0-6,50,'oneway'));P(dir>0?WW-260:20,y0+110,240,'cloud',{net:1});
   const ledges=6;const topY=y0-14-(ledges-1)*42+46;
   P(dir>0?inner:inner,topY,14,'wall',{h:(y0-75)-topY});
   for(let k=0;k<ledges;k++){const yy=y0-14-k*42;const left=(k%2==0)==(dir>0);const lx=dir>0?(left?inner+14:WW-48):(left?14:inner-54+14);addPath(P(dir>0?(left?inner+14:WW-66):(left?14:inner-52),yy,52,'oneway',{zone:zoneOf(yy)}))}
   // wall-jump bonus stars high up the shaft
   for(let k=0;k<5;k++)stars.push({x:dir>0?WW-14:14,y:y0-40-k*50});
   y=L().y;x=L().x+20;
   const ex=dir>0?inner-22:inner+36;y-=24;x=ex;addPath(P(ex-25,y,50,'oneway'));
  }else if(kind=='spring'){P(dir>0?WW-260:20,L().y+110,240,'cloud',{net:1});x+=dir*60;y-=10;const p=addPath(P(x-26,y,52,'oneway'));springs.push({x:x,y,p});y-=185;const q=addPath(P(x-30,y,60,'oneway'));for(let k=0;k<6;k++)stars.push({x,y:y+30+k*25});x=q.x+30}
  else{P(dir>0?WW-260:20,L().y+110,240,'cloud',{net:1});for(let k=0;k<5;k++){x+=(k%2?-1:1)*dir*55;y-=48;addPath(P(x-24,y,48,zoneOf(y)=='cloud'&&k%2?'cloud':'oneway'));if(k==2)stars.push({x,y:y-14})}}
  // checkpoint at the start of each 2nd leg
  if(leg%2==0){const p=L();p.mover=false;cps.push({x:p.x+p.w/2,y:p.y,p,on:false})}
  dir=-dir;
 }
 // final approach to castle (centre of world)
 const cx=WW/2;while(Math.abs(x-cx)>60||y-TOP>60){x+=Math.sign(cx-x)*Math.min(70,Math.abs(cx-x));y-=Math.min(40,Math.max(0,(y-TOP)-30));addPath(P(x-25,y,50,'oneway'));if(path.length>400)break}
 castle={x:cx-220,y:TOP,w:440,h:30,t:'oneway',castle:true};plats.push(castle);addPath(castle);
 for(let k=0;k<8;k++)stars.push({x:cx-140+k*40,y:TOP-14});
 enemies=enemies.filter(e=>!cps.some(c=>c.p===e.p));
 stars.forEach(s=>s.got=false);
 for(const p of plats)p.zone=p.zone||zoneOf(p.y);
 bakeArt()}
// ================= ART BAKE =================
let skyC,mountC,hillC,bankC,farC;
const SKY=[[0,'#7fd4ff'],[.18,'#a8e6ff'],[.4,'#ffe0f0'],[.6,'#ffbfe0'],[.8,'#cbb6ff'],[1,'#7f6ee6']];
function hx(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
const B4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function bakeArt(){const H=Math.ceil((-TOP+800)/2);skyC=mk(32,H);const g=skyC.getContext('2d'),im=g.createImageData(32,H),d=im.data,pal=SKY.map(s=>hx(s[1]));
 for(let y=0;y<H;y++){const alt=Math.max(0,Math.min(1,(H-y)/H));let k=0;while(k<SKY.length-2&&alt>SKY[k+1][0])k++;const f=(alt-SKY[k][0])/(SKY[k+1][0]-SKY[k][0]);
  for(let x=0;x<32;x++){const c=f>B4[(y&3)*4+(x&3)]/16?pal[k+1]:pal[k];const o=(y*32+x)*4;d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=255}}g.putImageData(im,0,0);
 // mountains
 mountC=mk(512,150);let m=mountC.getContext('2d');seed=5;const pk=[];for(let x=0;x<=512;x+=64)pk.push([x,rr(20,70)]);pk[pk.length-1][1]=pk[0][1];
 m.fillStyle='#b9a9ee';m.beginPath();m.moveTo(0,150);for(let i=0;i<pk.length-1;i++){const[a,b]=pk[i],[c]=pk[i+1];m.lineTo(a,b);m.lineTo(a+32,b+rr(25,45))}m.lineTo(512,pk[pk.length-1][1]);m.lineTo(512,150);m.fill();
 m.globalCompositeOperation='source-atop';for(let y=0;y<150;y+=2)for(let x=(y/2)%2*2;x<512;x+=4)if(y>90)m.fillStyle='#a796e3',m.fillRect(x,y,2,2);
 m.fillStyle='#fff';for(const[a,b]of pk){m.beginPath();m.moveTo(a-12,b+12);m.lineTo(a,b);m.lineTo(a+12,b+12);m.lineTo(a+5,b+9);m.lineTo(a,b+14);m.lineTo(a-5,b+9);m.fill()}
 m.globalCompositeOperation='source-over';
 // hills
 hillC=mk(384,100);m=hillC.getContext('2d');for(let i=0;i<6;i++){const cx=i*72+20,r=rr(40,60);m.fillStyle=OL;m.beginPath();m.arc(cx,100,r+2,Math.PI,0);m.fill();m.fillStyle=i%2?'#8fe08a':'#a6ec9c';m.beginPath();m.arc(cx,100,r,Math.PI,0);m.fill();
  m.fillStyle='rgba(255,255,255,.35)';m.beginPath();m.arc(cx-r*.35,100-r*.6,r*.18,0,7);m.fill();for(let k=0;k<4;k++){const tx=cx+rr(-r*.6,r*.6);m.fillStyle='#5cbf5c';m.fillRect(tx|0,100-r*.5+rr(0,20)|0,3,3)}}
 // copy edges to tile
 // cloud bank
 bankC=mk(320,80);m=bankC.getContext('2d');for(const[fill,o] of [[OL,2],['#ffffff',0]]){m.fillStyle=fill;for(let i=0;i<9;i++){m.beginPath();m.arc(i*40,40+(i%2)*8,22+o+(i%3)*4,0,7);m.fill()}m.fillRect(0,48-o,320,40)}
 m.fillStyle='#e6dcff';for(let i=0;i<9;i++){m.beginPath();m.arc(i*40+6,56,14,0,7);m.fill()}m.fillRect(0,60,320,20);
 // far castle silhouette
 farC=mk(90,80);m=farC.getContext('2d');m.fillStyle='rgba(255,255,255,.75)';m.fillRect(15,40,60,40);m.fillRect(5,22,16,58);m.fillRect(69,22,16,58);m.fillRect(36,12,18,68);
 for(const[x,y,w]of[[5,22,16],[69,22,16],[36,12,18]]){m.beginPath();m.moveTo(x-2,y);m.lineTo(x+w/2,y-14);m.lineTo(x+w+2,y);m.fill()}
 m.fillStyle='rgba(255,170,210,.8)';m.fillRect(42,56,6,24);
 seed=7}
// ================= AUDIO =================
let A=null,music=true,musT=0,step=0,track='title',nextTrack='title',master,pulse25,pulse12;
function ac(){if(!A){try{A=new (window.AudioContext||window.webkitAudioContext)();master=A.createGain();master.gain.value=.8;master.connect(A.destination);pulse25=mkPulse(.25);pulse12=mkPulse(.125)}catch(e){}}if(A&&A.state=='suspended')A.resume();return A}
function mkPulse(duty){const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)im[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*duty);return A.createPeriodicWave(re,im)}
function nt(f,dur,type='square',vol=.06,t0=0,f2,vib){if(!A)return;const t=t0||A.currentTime,o=A.createOscillator(),g=A.createGain();if(type=='p25')o.setPeriodicWave(pulse25);else if(type=='p12')o.setPeriodicWave(pulse12);else o.type=type;
 o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
 if(vib){const l=A.createOscillator(),lg=A.createGain();l.frequency.value=6;lg.gain.value=f*.02;l.connect(lg).connect(o.frequency);l.start(t+.06);l.stop(t+dur)}
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.setValueAtTime(vol,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur+.02)}
let nbuf=null;function noise(t,dur,vol,hp,lp){if(!A)return;if(!nbuf){nbuf=A.createBuffer(1,A.sampleRate,A.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 const s=A.createBufferSource();s.buffer=nbuf;const f=A.createBiquadFilter();f.type=hp?'highpass':'lowpass';f.frequency.value=hp||lp||2000;const g=A.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
const mf=n=>440*Math.pow(2,(n-69)/12);
// chords: root midi + quality
const CH={C:[48,0,4,7],Am:[45,0,3,7],F:[41,0,4,7],G:[43,0,4,7],Dm:[50,0,3,7],Em:[52,0,3,7],Bb:[46,0,4,7],D:[50,0,4,7],E:[52,0,4,7]};
const TR={
 title:{bpm:118,lead:'p25',chords:['C','F','G','C'],mel:[72,0,76,0,79,0,76,77, 77,0,81,0,79,77,76,74, 74,0,79,0,77,76,74,71, 72,76,79,84,0,0,0,0],drum:'light'},
 ground:{bpm:142,lead:'p25',chords:['C','Am','F','G','C','Am','F','G'],
  mel:[72,0,76,79,76,74,72,0, 69,72,76,0,74,72,69,0, 65,69,72,77,76,0,74,72, 74,0,71,74,79,0,0,0, 79,0,77,76,77,79,84,0, 81,79,76,0,72,74,76,0, 77,76,74,72,69,72,74,0, 71,74,79,77,76,0,72,0],drum:'full'},
 hill:{bpm:150,lead:'p25',chords:['F','G','Em','Am','F','G','C','C'],
  mel:[77,0,76,77,79,0,72,0, 79,0,77,79,81,0,74,0, 79,81,79,76,71,72,74,76, 72,0,76,0,81,0,79,0, 77,76,77,81,84,0,81,0, 79,77,79,83,86,0,83,0, 84,0,79,0,76,0,79,0, 84,0,0,0,0,0,0,0],drum:'full'},
 cloud:{bpm:112,lead:'triangle',chords:['F','Dm','Bb','C','F','Dm','Bb','C'],
  mel:[77,0,81,0,84,0,81,79, 77,0,74,0,77,0,0,0, 70,0,74,77,82,0,81,79, 79,0,0,76,72,0,0,0, 81,0,84,0,89,0,88,86, 84,0,81,0,77,0,74,0, 77,79,82,86,84,0,82,81, 77,0,0,0,0,0,0,0],drum:'soft'},
 castle:{bpm:132,lead:'p25',chords:['G','Em','C','D','G','Em','C','D'],
  mel:[79,0,79,83,86,0,83,0, 79,0,76,79,83,0,0,0, 76,0,79,84,88,0,86,84, 81,0,78,81,86,0,0,0, 91,0,88,86,83,0,86,88, 86,0,83,79,76,0,79,83, 84,83,81,79,76,79,84,88, 86,0,0,0,79,0,0,0],drum:'march'}};
function musicTick(){if(!A)return;const tr=TR[track],sp=60/tr.bpm/4;
 while(musT<A.currentTime+.2){if(musT<A.currentTime-.05)musT=A.currentTime+.02;
  if(music&&(state!='pause')){const t=musT,s=step,bar=(s>>4)%tr.chords.length,c=CH[tr.chords[bar]],pos=s&15,mi=(s>>1)%tr.mel.length;
   if(!(s&1)){const m=tr.mel[mi];if(m){let len=1;while(len<4&&!tr.mel[(mi+len)%tr.mel.length])len++;nt(mf(m),sp*2*len*.92,tr.lead,tr.lead=='triangle'?.09:.045,t,0,len>2);nt(mf(m)*1.003,sp*2*len*.5,'p12',.012,t+sp*.5)}}
   // harmony arpeggio
   const ar=[0,1,2,1][pos&3],hn=c[0]+24+c[1+ar];if(pos%2==0||tr.drum!='soft')nt(mf(hn),sp*.9,'p12',.018,t);
   // bass

function fireworks(){if(rnd()<.07){const x=WW/2+rr(-140,140),y=TOP-rr(90,200),c=['#ffe066','#ff8fc8','#8fd3ff','#7dff9a','#fff'][rnd()*5|0];for(let i=0;i<28;i++){const a=i/28*6.28,s=50+rnd()*20;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c,g:0})}ring(x,y,c);sfx('boom')}}
let startT=0;
function save(){try{localStorage.puffball=JSON.stringify({cp:cps.indexOf(H.cp),stars:H.stars})}catch(e){}}
function start(fromSave){ac();buildLevel();H=newHero(150,-12);cam={x:0,y:-VH*.7,la:0};time=0;startT=0;
 if(fromSave){try{const s=JSON.parse(localStorage.puffball);if(s.cp>=0){for(let i=0;i<=s.cp;i++)cps[i].on=true;H.cp=cps[s.cp];respawn();H.stars=s.stars}}catch(e){}}
 state='play';['#title','#win','#pause'].forEach(s=>$(s).classList.remove('show'));$('#hud').style.display='flex';$('#lc').style.display=$('#rc').style.display='flex';setTrack('ground');track='ground';step=0;cam.x=H.cx-VW/2;cam.y=H.cy-VH*.58}
$('#playB').onclick=()=>start(false);$('#contB').onclick=()=>start(true);$('#againB').onclick=()=>start(false);
try{if(localStorage.puffball&&JSON.parse(localStorage.puffball).cp>=0)$('#contB').style.display=''}catch(e){}
function pause(on){if(state=='title'||state=='win')return;state=on?'pause':'play';$('#pause').classList.toggle('show',on)}
$('#pauseB').onclick=()=>pause(true);$('#resB').onclick=()=>pause(false);$('#cpB').onclick=()=>{respawn();pause(false)};
$('#musB').onclick=()=>{music=!music;$('#musB').textContent='MUSIC: '+(music?'ON':'OFF')};
$('#quitB').onclick=()=>{save();state='title';setTrack('title');$('#pause').classList.remove('show');$('#title').classList.add('show');$('#hud').style.display='none';$('#lc').style.display=$('#rc').style.display='none'};
document.querySelectorAll('.ctl button').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();ac();keys[k]=true;b.classList.add('dn')},off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('dn')};
 b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
document.addEventListener('pointerdown',()=>ac(),{once:true});
const KM={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',Space:'J',KeyZ:'J',ArrowUp:'J',KeyW:'J',KeyX:'G',KeyC:'G',ArrowDown:'D',KeyS:'D'};
addEventListener('keydown',e=>{ac();if(e.code=='KeyP'||e.code=='Escape'){pause(state=='play');return}if(state=='title'&&(e.code=='Enter'||e.code=='Space')){start(false);return}const k=KM[e.code];if(k){keys[k]=true;e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=false});
buildLevel();H=newHero(150,-12);cam={x:0,y:-VH*.75,la:0};
const stats={fps:0,frames:0};
function tick(dt){if(state=='play'){if(!startT)startT=time||1e-9;update(dt);$('#hearts').textContent='♥'.repeat(Math.max(0,H.hearts))+'♡'.repeat(3-Math.max(0,H.hearts));$('#stars').textContent='★ '+H.stars;$('#ht').textContent=Math.max(0,-H.cy/10|0)+'m'}
 else if(state=='title'){const sv=window.__bot;window.__bot={J:(time%2.4)>2.0,R:(time%8)<1,L:(time%8)>4&&(time%8)<5};update(dt);window.__bot=sv;cam.x=Math.max(0,H.cx-VW/2)}
 else if(state=='win'){time+=dt;fireworks();stepParts(dt);const sv=window.__bot;window.__bot={J:(time%1.2)<.05};heroStep(dt);window.__bot=sv;cam.y+=(TOP-VH*.62-cam.y)*dt*2;cam.x+=(WW/2-VW/2-cam.x)*dt*2}}
let last=performance.now(),acc=0,fN=0,fT=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;acc+=dt;let n=0;while(acc>=1/60&&n<3){tick(1/60);acc-=1/60;n++}if(n==3)acc=0;render();stats.frames++;fN++;fT+=dt;if(fT>=1){stats.fps=fN/fT;fN=0;fT=0}}
requestAnimationFrame(loop);

window.__pb={stats,get H(){return H},get path(){return path},get state(){return state},get cam(){return cam},get stars(){return stars},start,tick,render,get time(){return time},get track(){return track},
 botTarget(){if(!H)return null;let k=0;if(H.ground&&H.ground.idx!=null)k=H.ground.idx;else if(this._cur)k=this._cur;const t=path[Math.min(path.length-1,k+1)];return t?{x:t.castle?WW/2:t.x+t.w/2,y:t.y}:null},
 bot(){const onG=H.gT>0||H.coyote>0;
  if(H.ground&&H.gT>0){if(H.ground.idx!=null){this._cur=H.ground.idx;this._side=null}else{let k=this._cur||0;let best=k,bd=1e9;for(let j=Math.max(0,k-15);j<Math.min(path.length,k+15);j++){const p=path[j];if(p.y>=H.ground.y-2){const d=Math.abs(p.y-H.ground.y)+Math.abs(p.x+p.w/2-H.cx)*.3;if(d<bd){bd=d;best=j}}}this._cur=best;this._side=H.ground}}
  let cur=this._cur||0;const tgt=path[Math.min(path.length-1,cur+1)];const b={};
  const tx=tgt.castle?WW/2:tgt.x+tgt.w/2;const curP=(this._side&&H.ground===this._side)?this._side:path[cur];
  const lo=curP.t=='solid'?10:curP.x+10,hi=curP.t=='solid'?WW-10:curP.x+curP.w-10;
  const stand=Math.max(lo,Math.min(hi,tx));const need=(curP.y-tgt.y)+14+Math.max(0,Math.abs(tx-stand)-tgt.w/2-45)*1.0;
  if(onG&&!this._ch){if(Math.abs(H.cx-stand)>8){b[H.cx<stand?'R':'L']=true}else if(Math.abs(H.vxs/HS)>25){}else{this._ch=true;this._t=0}}
  if(this._ch){const th=need>64?Math.min(.85,.15+(need-60)/120):0;this._t+=1/60;if(this._t<th+.02)b.J=true;else this._ch=false}
  if(!onG&&Math.abs(H.cx-tx)>3)b[H.cx<tx?'R':'L']=true;
  return b}};
