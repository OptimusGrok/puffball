<script>

const $=s=>document.querySelector(s),cv=$('#c'),ctx=cv.getContext('2d');

function resize(){const w=innerWidth,h=innerHeight;SC=Math.max(1,Math.min(w/LW,h/200));VW=Math.ceil(w/SC);VH=Math.ceil(h/SC);cv.width=VW;cv.height=VH;offX=(VW-LW)/2|0;ctx.imageSmoothingEnabled=false}

// ---------- RNG / Level ----------
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647},rr=(a,b)=>a+rnd()*(b-a);
let plats,path,stars,springs,enemies,hooks,cps,winds,trees,castle;
function buildLevel(){seed=7;plats=[];path=[];stars=[];springs=[];enemies=[];hooks=[];cps=[];winds=[];trees=[];
 const ground={x:-200,y:0,w:640,h:80,t:'solid'};plats.push(ground);path.push(ground);
 let px=120,y=0,i=0;
 while(y>TOP+120){i++;const zone=y>-2000?'grass':y>-4000?'hill':'cloud';
  let dy=rr(36,58);const big=i>8&&i%9==0;if(big)dy=rr(95,115);y-=dy;if(y<TOP+110)break;
  const w=zone=='cloud'?rr(38,56):rr(40,62);let nx=px+rr(-80,80);if(Math.abs(nx-px)<22)nx=px+(nx<px?-30:30);nx=Math.max(w/2+6,Math.min(LW-w/2-6,nx));
  if(big){const pv=path[path.length-1];if(pv.t=='cloud')pv.t='oneway';}let t=zone=='cloud'?(rnd()<.45?'cloud':'oneway'):'oneway';const p={x:nx-w/2,y,w,h:7,t,zone,big};
  if(zone=='cloud'&&rnd()<.3&&!big){p.move=rr(18,34);p.ph=rnd()*6;p.bx=p.x;p.t='oneway';p.mover=true;p.x=Math.max(6+p.move,Math.min(LW-w-6-p.move,p.x));p.bx=p.x}
  plats.push(p);path.push(p);px=nx;
  if(rnd()<.55)stars.push({x:nx,y:y-14,got:false});
  if(i%7==3){const sx=nx>120?rr(14,60):rr(180,226);const sp={x:sx-22,y:y-rr(0,20),w:44,h:7,t:zone=='cloud'?'cloud':'oneway',zone};plats.push(sp);stars.push({x:sx-6,y:sp.y-12,got:false},{x:sx+6,y:sp.y-12,got:false});
   if(i>10&&rnd()<.6)enemies.push({kind:zone=='cloud'?'buzz':'bloop',x:sx,y:sp.y-7,p:sp,dir:1,alive:true,by:sp.y-24,ph:rnd()*6})}
  if(zone=='grass'&&rnd()<.5)trees.push({x:rr(10,230),y:y+rr(10,40),s:rr(.8,1.4)});
  if(false)enemies.push({kind:'bloop',x:p.x+w/2,y:p.y-7,p,dir:1,alive:true});
  if(zone=='cloud'&&i%11==5)winds.push({y0:y-90,y1:y+20,dir:rnd()<.5?-1:1,ph:rnd()*6});
  if(zone!='grass'&&i%13==6&&!p.mover){springs.push({x:p.x+p.w/2,y:p.y,p})}
  if(zone=='cloud'&&i%6==2)hooks.push({x:LW-px<120?rr(30,90):rr(150,210),y:y-rr(30,60)});
 }
 {let ly=path[path.length-1].y;while(ly-TOP>60){ly-=Math.min(50,(ly-TOP)/2);const w=50,nx=ly-TOP<60?60:180;const p={x:(path.length%2?60:150),y:ly,w,h:7,t:'oneway',zone:'cloud'};plats.push(p);path.push(p)}}
 // checkpoints
 [Math.floor(path.length*.25),Math.floor(path.length*.5),Math.floor(path.length*.75)].forEach(k=>{const p=path[k];p.mover=false;p.move=0;cps.push({x:p.x+p.w/2,y:p.y,p,on:false})});
 enemies=enemies.filter(e=>!cps.some(c=>c.p===e.p));
 castle={x:0,y:TOP,w:LW,h:30,t:'oneway',castle:true};plats.push(castle);path.push(castle);
 for(let k=0;k<6;k++)stars.push({x:40+k*32,y:TOP-14,got:false});
 // ensure last gap reachable
 path.forEach((p,k)=>p.idx=k);bakeSky()}
// ---------- Sky bake (dithered) ----------
let sky;const SKY=[[0,'#7fd4ff'],[.2,'#a6e3ff'],[.45,'#ffd6ee'],[.65,'#ffb8dc'],[.85,'#c8b4ff'],[1,'#8e7cf0']];
function hx(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function bakeSky(){const W=480,H=Math.ceil((-TOP+500)/2);sky=document.createElement('canvas');sky.width=W/2;sky.height=H;const g=sky.getContext('2d'),im=g.createImageData(W/2,H),d=im.data;
 const B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5],pal=SKY.map(s=>hx(s[1]));
 for(let y=0;y<H;y++){const alt=Math.max(0,Math.min(1,(H-y)/H));let k=0;while(k<SKY.length-2&&alt>SKY[k+1][0])k++;const f=(alt-SKY[k][0])/(SKY[k+1][0]-SKY[k][0]);
  const steps=f*4,lo=Math.floor(steps)/4;
  for(let x=0;x<W/2;x++){const th=B[(y&3)*4+(x&3)]/16;const ff=f*1;const c=(ff>th)?pal[k+1]:pal[k];const o=(y*W/2+x)*4;d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=255}}
 g.putImageData(im,0,0);
 // far stars & puffs
 seed=99;for(let n=0;n<500;n++){const x=rnd()*W/2,y=rnd()*H*.5;g.fillStyle='#fff';g.fillRect(x|0,y|0,1,1)}
 for(let n=0;n<120;n++){const x=rnd()*W/2,y=H*.15+rnd()*H*.75,r=4+rnd()*8;g.fillStyle='rgba(255,255,255,.55)';for(let k=0;k<4;k++){g.beginPath();g.arc(x+k*r*.8,y-(k%2)*r*.4,r*(k%2?1.1:.8),0,7);g.fill()}}
 seed=7}
// ---------- Audio ----------
let A=null,music=true,musT=0,musStep=0;function ac(){if(!A){try{A=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(A&&A.state=='suspended')A.resume();return A}
function nt(f,dur,type='square',vol=.06,t0=0,f2){const a=A;if(!a)return;const t=t0||a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
const mf=n=>440*Math.pow(2,(n-69)/12);
const MEL=[72,0,76,79,81,79,76,0,74,0,77,81,79,0,76,74, 72,0,76,79,84,83,81,79,77,76,74,76,72,0,0,0, 69,0,72,76,77,76,72,0,71,0,74,77,76,74,72,71, 72,76,79,84,83,81,79,77,76,0,74,0,72,0,0,0];
const BAS=[48,55,52,55,53,60,55,60,45,52,48,52,43,50,47,50];
function musicTick(){if(!A||!music||state!='play')return;const sp=60/150/2;while(musT<A.currentTime+.15){if(musT<A.currentTime)musT=A.currentTime;const m=MEL[musStep%64];if(m)nt(mf(m),sp*.9,'square',.035,musT);if(musStep%2==0)nt(mf(BAS[(musStep/2|0)%16]),sp*1.8,'triangle',.09,musT);if(musStep%4==2)nt(6000,.03,'square',.008,musT);musT+=sp;musStep++}}
setInterval(musicTick,40);
const SFX={jump:()=>nt(380,.15,'square',.07,0,760),cjump:()=>{nt(220,.3,'square',.08,0,1100)},land:()=>nt(160,.07,'triangle',.12,0,80),star:()=>{nt(1320,.08,'square',.05);nt(1760,.12,'square',.05,A.currentTime+.07)},
 stomp:()=>nt(600,.12,'square',.07,0,200),hurt:()=>nt(300,.3,'sawtooth',.07,0,80),spring:()=>nt(200,.35,'square',.07,0,1400),cloud:()=>nt(300,.18,'sine',.12,0,600),cp:()=>[0,.1,.2].forEach((d,i)=>nt(mf(76+i*4),.15,'square',.06,A.currentTime+d)),
 grab:()=>nt(500,.1,'triangle',.08,0,900),stick:()=>nt(120,.08,'sine',.1),charge:()=>nt(150,.05,'triangle',.04,0,300),
 win:()=>[72,76,79,84,79,84,88].forEach((n,i)=>nt(mf(n),.22,'square',.07,A.currentTime+i*.13))};
const lastS={};function sfx(k){if(!A)return;const t=performance.now();if(lastS[k]&&t-lastS[k]<60)return;lastS[k]=t;SFX[k]()}
// ---------- Hero soft body ----------
const N=14,R=9,G=900;let H,cam,state='title',time=0,keys={},parts=[];
function newHero(x,y){const p=[];for(let i=0;i<N;i++){const a=i/N*Math.PI*2;p.push({x:x+Math.cos(a)*R,y:y+Math.sin(a)*R,ox:0,oy:0,rx:Math.cos(a)*R,ry:Math.sin(a)*R});p[i].ox=p[i].x;p[i].oy=p[i].y}
 return{p,cx:x,cy:y,vx:0,vy:0,sx:1,sy:1,ground:null,gT:0,wall:0,stickT:0,charge:0,chargeOn:false,hook:null,hookLen:0,face:{blink:0,next:2,happy:0},hearts:3,inv:0,stars:0,drop:0,facing:1,airT:0,maxFall:0,cp:null,best:0}}
function centroid(){let x=0,y=0,vx=0,vy=0;for(const q of H.p){x+=q.x;y+=q.y;vx+=q.x-q.ox;vy+=q.y-q.oy}H.cx=x/N;H.cy=y/N;H.vxs=vx/N;H.vys=vy/N}
function setVel(vx,vy,h){for(const q of H.p){if(vx!==null)q.ox=q.x-vx*h;if(vy!==null)q.oy=q.y-vy*h}}
function addVel(dx,dy,h){for(const q of H.p){q.ox-=dx*h;q.oy-=dy*h}}
function areaP(){let a=0;for(let i=0;i<N;i++){const p=H.p[i],q=H.p[(i+1)%N];a+=p.x*q.y-q.x*p.y}return a/2}
const A0=Math.PI*R*R*.97,EL=2*R*Math.sin(Math.PI/N);
function input(){const b=window.__bot;if(b)return b;return{L:keys.L,R:keys.R,J:keys.J,G:keys.G,D:keys.D}}
let prevIn={};
function heroStep(dt){const inp=input(),sub=4,h=dt/sub;
 const onG=H.gT>0||H.coyote>0;
 if(inp.J&&!prevIn.J){H.jPress=time;if(H.hook){H.hook=null;centroid();setVel(null,Math.min(H.vys/h*0-0, -260),1);}else if(!onG&&H.wall&&H.stickT<.9){wallJump()}}
 if(inp.J&&onG&&time-H.jPress>.1){if(!H.chargeOn)sfx('charge');H.chargeOn=true;H.charge=Math.min(1,H.charge+dt*1.4)}
 if(!inp.J&&prevIn.J&&onG&&H.jPress!=null){doJump(H.chargeOn?H.charge:0)}
 if(!inp.J){H.chargeOn=false;if(!onG)H.charge=0}
 if(inp.G&&!prevIn.G){if(H.hook)H.hook=null;else{let best=null,bd=85;for(const k of hooks){const d=Math.hypot(k.x-H.cx,k.y-H.cy);if(d<bd){bd=d;best=k}}if(best){H.hook=best;H.hookLen=bd;sfx('grab')}}}
 if(inp.D&&!prevIn.D)H.drop=.25;
 prevIn={...inp};
 // target shape
 centroid();const vy=H.vys/ (1/240),vx=H.vxs/(1/240);
 let sy=1,sx=1;if(H.chargeOn){sy=1-.42*H.charge;sx=1+.38*H.charge}else if(H.gT<=0){const s=Math.min(.38,Math.abs(vy)/1100);sy=1+s;sx=1/(1+s*.8)}
 if(H.wall&&H.gT<=0){sx*=.85;sy*=1.1}
 H.sx+=(sx-H.sx)*.25;H.sy+=(sy-H.sy)*.25;
 const wind=windAt(H.cy);
 for(let s=0;s<sub;s++){
  centroid();const cvx=H.vxs/h;let want=(inp.R?1:0)-(inp.L?1:0);if(H.chargeOn)want*=.2;if(want)H.facing=want;
  const acc=H.gT>0?.22:.08,target=want*115+(H.gC?H.gC.vx||0:0);let dv=(target-cvx)*acc;if(!want&&H.gT<=0)dv=wind*h*4;
  addVel(dv,0,h);

  if(H.hook){const dx=H.hook.x-H.cx,dy=H.hook.y-H.cy,d=Math.hypot(dx,dy);H.hookLen=Math.max(22,H.hookLen-70*h);if(d>H.hookLen){const e=(d-H.hookLen)/d*.35;for(const q of H.p){q.x+=dx*e;q.y+=dy*e}}}
  for(const q of H.p){let qvx=(q.x-q.ox)*.999,qvy=(q.y-q.oy)*.999;q.ox=q.x;q.oy=q.y;q.x+=qvx+wind*h*h*(H.gT>0?.3:1);q.y+=qvy+g*h*h}
  for(let it=0;it<2;it++){centroid();
   // shape match (no rotation: stays upright like putty)
   const k=.14;for(const q of H.p){const gx=H.cx+q.rx*H.sx,gy=H.cy+q.ry*H.sy;q.x+=(gx-q.x)*k;q.y+=(gy-q.y)*k}
   if(H.hook){// stretch towards hook
    const dx=H.hook.x-H.cx,dy=H.hook.y-H.cy,d=Math.hypot(dx,dy)||1;for(const q of H.p){const dd=((q.x-H.cx)*dx+(q.y-H.cy)*dy)/d/R;if(dd>.5){q.x+=dx/d*dd*1.2;q.y+=dy/d*dd*1.2}}}
   for(let i=0;i<N;i++){const a=H.p[i],b=H.p[(i+1)%N];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1e-6;const f=(d-EL*Math.sqrt(H.sx*H.sy))/d*.25;a.x+=dx*f;a.y+=dy*f;b.x-=dx*f;b.y-=dy*f}
   const per=EL*N,amt=Math.max(-2,Math.min(2,(A0*H.sx*H.sy-areaP())/per*.8));for(let i=0;i<N;i++){const pr=H.p[(i+N-1)%N],nx=H.p[(i+1)%N],q=H.p[i],tx=nx.x-pr.x,ty=nx.y-pr.y,l=Math.hypot(tx,ty)||1;q.x+=ty/l*amt;q.y-=tx/l*amt}

function doJump(c){const v=380+c*190;setVel(null,-v,1/240);H.gT=0;H.coyote=0;H.charge=0;H.chargeOn=false;H.jPress=null;sfx(c>.2?'cjump':'jump');if(c>.2)burst(H.cx,H.cy+R,8,'#fff')}

  for(const p of near){if(q.x<p.x||q.x>p.x+p.w)continue;
   if(p.t=='solid'){if(q.y>p.y&&q.y<p.y+p.h){if(q.oy<=p.y+2){q.y=p.y;gnd=p;if(vy>0)q.oy=q.y-vy*h*.05}else{q.y=p.y+p.h;q.oy=q.y}}continue}

// ---------- World update ----------
let msg='',msgT=0;

function update(dt){time+=dt;
